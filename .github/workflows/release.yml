name: Release Builds

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
      # Sign with the same release keystore as local builds — an APK signed by
      # anything else (e.g. the runner's throwaway debug key) cannot update an
      # installed All-In and forces an uninstall that loses all local data.
      - name: Install release keystore
        run: |
          echo "${{ secrets.ALLIN_KEYSTORE_BASE64 }}" | base64 -d > android/app/allin-release.jks
          cat > android/key.properties << EOF
          storePassword=${{ secrets.ALLIN_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ALLIN_KEYSTORE_PASSWORD }}
          keyAlias=allin
          storeFile=allin-release.jks
          EOF
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --split-per-abi --release
      - name: Verify signing certificate
        run: |
          # Runners carry several build-tools versions; take the newest apksigner.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            # Capture first, then match with here-strings: this shell runs with
            # -o pipefail, so piping into an early-exiting reader like `grep -q`
            # or `head -1` can fail the step with SIGPIPE (141) even when the
            # check itself passed.
            CERTS=$("$APKSIGNER" verify --print-certs "$apk")
            # "Android Debug" appears in the DN line, not the digest line.
            case "$CERTS" in *"Android Debug"*) echo "refusing to release a debug-signed APK" >&2; exit 1;; esac
            CERT=$(grep -m1 'SHA-256 digest' <<<"$CERTS" || true)
            echo "$apk: $CERT"
            grep -qF '1abea51cfb66ae07c02a71d7a3f0ce9cfaab92ad67241bbd9ec4f5a0731107eb' <<<"$CERT" || { echo "$apk is not signed with the All-In release keystore" >&2; exit 1; }
          done
      - name: Verify ABI contents
        run: |
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            # Same SIGPIPE-under-pipefail trap as the signing step: list into a
            # variable, then match, so `unzip` is never killed mid-write.
            ENTRIES=$(unzip -Z1 "app-$abi-release.apk")
            grep -qxF "lib/$abi/libflutter.so" <<<"$ENTRIES" || { echo "app-$abi-release.apk lacks lib/$abi" >&2; exit 1; }
          done
      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          VERSION=${GITHUB_REF_NAME#v}
          mv app-arm64-v8a-release.apk "allin-$VERSION-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "allin-$VERSION-armeabi-v7a.apk"
          mv app-x86_64-release.apk "allin-$VERSION-x86_64.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/allin-*-arm64-v8a.apk
            build/app/outputs/flutter-apk/allin-*-armeabi-v7a.apk
            build/app/outputs/flutter-apk/allin-*-x86_64.apk
